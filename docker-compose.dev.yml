services:
  caddy:
    image: caddy:2
    environment:
      - TZ=Asia/Seoul
      - SODAM_DOMAIN=${SODAM_DOMAIN:-3.sodam.store}
    network_mode: host
    volumes:
      - ./Caddyfile.template:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    env_file: ./db.env
    environment:
      - TZ=Asia/Seoul
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    command: ['postgres', '-c', 'timezone=Asia/Seoul']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      - TZ=Asia/Seoul
    command:
      [
        'redis-server',
        '--maxmemory',
        '512mb',
        '--maxmemory-policy',
        'noeviction',
        '--save',
        '60',
        '1',
        '--loglevel',
        'warning',
      ]
    ports:
      - '6379:6379' # agent 서비스에서 localhost로 접근할 수 있도록
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: node:20-slim
    working_dir: /app
    env_file: ./api.env
    environment:
      - TZ=Asia/Seoul
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./secrets:/secrets:ro
      - .:/app # 소스 코드 마운트
      - /app/node_modules # 컨테이너 내부 의존성 보호
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    command: >
      sh -c "
      npm install &&
      npx prisma generate &&
      npm run start:dev
      "
    restart: unless-stopped

  web:
    image: node:20-slim
    working_dir: /app
    env_file: ../ops-web/web.env
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ../ops-web:/app # 소스 코드 마운트
      - /app/node_modules # 컨테이너 내부 의존성 보호
      - /app/.next # 빌드 캐시 보호
    ports:
      - '127.0.0.1:3000:3000'
    # 개발용 실행 명령 (Next.js 기본값 가정)
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

  # RAG 인덱싱 워커 컨테이너
  # HTTP 서버 없이 BullMQ 프로세서만 동작하는 경량 서비스
  indexing-worker:
    image: node:20-slim
    working_dir: /app
    env_file: ./api.env
    environment:
      - TZ=Asia/Seoul
      # 워커 전용 환경변수
      - WORKER_CONCURRENCY=5
      # Bull Board UI 인증 (API에서 접근)
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./secrets:/secrets:ro
      - .:/app # 소스 코드 마운트
      - /app/node_modules # 컨테이너 내부 의존성 보호
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Graceful Shutdown 설정 (30초 대기)
    stop_grace_period: 30s
    # 메모리 제한 (1GB)
    deploy:
      resources:
        limits:
          memory: 1G
    command: >
      sh -c "
      npm install &&
      npx prisma generate &&
      npm run start:worker:dev
      "
    restart: unless-stopped

volumes:
  caddy_data:
    external: true
    name: sodam_caddy_data
  caddy_config:
    external: true
    name: sodam_caddy_config
  db_data:
  redis_data:
